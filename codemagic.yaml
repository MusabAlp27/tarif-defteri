workflows:
  android-apk:
    name: Tarif Defteri APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Android projesini olustur ve kodu icine kopyala
        script: |
          flutter create build_app --platforms=android --project-name tarif_defteri
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
      - name: R8 kural dosyasini ekle
        script: |
          cd build_app/android/app
          echo "-dontwarn com.google.mlkit.vision.text.**" > proguard-rules.pro
          if [ -f build.gradle.kts ]; then
          cat >> build.gradle.kts <<'EOF'

          android {
              buildTypes {
                  release {
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }
          EOF
          fi
          if [ -f build.gradle ]; then
          cat >> build.gradle <<'EOF'

          android {
              buildTypes {
                  release {
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF
          fi
      - name: APK derle
        script: |
          cd build_app
          flutter pub get
          flutter build apk --release
    artifacts:
      - build_app/build/app/outputs/flutter-apk/*.apk
